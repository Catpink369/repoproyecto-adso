# Overlay para pruebas (Cypress / e2e).
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up --build -d
#
# Fuerza backend → gurama_test y no carga el .env de producción del backend.

services:
  backend:
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:doKi12345@db:5432/gurama_test?schema=public
      API_KEY: xyz123
      JWT_SECRET: clave_secreta_guruma
    env_file: []
