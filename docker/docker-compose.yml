name: gurama

services:
  backend:
    build:
      context: ../backend/backend
      dockerfile: Dockerfile
    container_name: gurama-backend
    ports:
      - "3000:3000"
    env_file:
      - ../backend/backend/.env
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_API_KEY: ${VITE_API_KEY}
        VITE_STORAGE_KEY: ${VITE_STORAGE_KEY}
    container_name: gurama-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: gurama-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - gurama_pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  gurama_pgdata: